name: Generate README Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Download Cards
        run: |
          mkdir -p profile
          curl -o profile/stats.svg "https://github-readme-stats.vercel.app/api?username=Karani42Karaman&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&token=${{ secrets.GITHUB_TOKEN }}"
          curl -o profile/top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=Karani42Karaman&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&token=${{ secrets.GITHUB_TOKEN }}"
          curl -o profile/streak.svg "https://streak-stats.demolab.com?user=Karani42Karaman&theme=tokyonight&hide_border=true"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push